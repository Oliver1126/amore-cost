<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Amore Cost slide</title>
<style>
  @font-face { font-family: "Work Sans"; src: url("../../../src/app/fonts/worksans-var.woff2") format("woff2"); font-weight: 400 700; }
  :root {
    --bg: #f2f3f0; --surface: #ffffff; --border: #e6e8e2; --text: #1b1f18; --muted: #6b7267;
    --accent: #1e8a5c; --accent-strong: #166b47; --accent-soft: #e3f2e9; --warn: #c8720e; --info: #2f6fb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: "Work Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); position: relative; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .g1 { width: 760px; height: 760px; background: #cfe9da; top: -260px; right: -200px; }
  .g2 { width: 620px; height: 620px; background: #f6e3c8; bottom: -300px; left: -220px; opacity: .45; }
  .brand { position: absolute; top: 48px; left: 72px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; z-index: 2; }
  .brand img { height: 46px; }
  .stage { position: absolute; inset: 130px 72px 190px 72px; display: flex; align-items: center; gap: 72px; z-index: 1; }
  .kicker { display: inline-block; font-size: 24px; font-weight: 600; color: var(--accent-strong); background: var(--accent-soft); padding: 8px 18px; border-radius: 999px; letter-spacing: .02em; }
  h1 { font-size: 64px; line-height: 1.08; font-weight: 700; margin-top: 22px; letter-spacing: -0.01em; white-space: pre-line; }
  .text { flex: 0 0 640px; }
  .facts { margin-top: 40px; display: flex; flex-direction: column; gap: 18px; }
  .fact { display: flex; gap: 16px; align-items: flex-start; font-size: 30px; line-height: 1.3; transition: none; }
  .fact .dot { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 20px; font-weight: 700; display: grid; place-items: center; margin-top: 2px; }
  .fact.dim { opacity: .22; }
  .shotwrap { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
  .frame { background: var(--surface); border-radius: 24px; box-shadow: 0 30px 80px rgba(20,40,30,.18), 0 0 0 1px var(--border); overflow: hidden; display: flex; flex-direction: column; max-width: 100%; max-height: 100%; }
  .frame .bar { height: 34px; background: #eceee9; display: flex; align-items: center; gap: 8px; padding: 0 16px; flex: none; }
  .frame .bar i { width: 12px; height: 12px; border-radius: 50%; background: #d5d8d1; display: block; }
  .frame img { display: block; max-width: 100%; max-height: 726px; object-fit: contain; }
  .phone { border-radius: 54px; padding: 16px; background: #111; box-shadow: 0 30px 80px rgba(20,40,30,.25); }
  .phone img { display: block; height: 700px; border-radius: 40px; }
  .receipt img { display: block; height: 880px; border-radius: 14px; box-shadow: 0 30px 80px rgba(20,40,30,.2); }
  .stage.receiptl { top: 96px; bottom: 150px; }
  /* title layout */
  .title { flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 0; }
  .title h1 { font-size: 112px; color: var(--accent-strong); }
  .title .sub { margin-top: 30px; font-size: 40px; color: var(--muted); font-style: italic; }
  .title .mark { height: 150px; margin-bottom: 26px; }
  /* cards layout */
  .cardsl { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; }
  .cards { margin-top: 56px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; width: 100%; }
  .card { background: var(--surface); border-radius: 24px; padding: 36px 32px; box-shadow: 0 0 0 1px var(--border), 0 14px 40px rgba(20,40,30,.08); min-height: 300px; }
  .card .ic { font-size: 64px; }
  .card h3 { font-size: 34px; margin-top: 22px; }
  .card p { font-size: 26px; color: var(--muted); margin-top: 12px; line-height: 1.35; }
  .card.dim { opacity: .22; }
  /* caption + progress */
  .caption { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; width: 1600px; text-align: center; z-index: 3; }
  .caption span { display: inline; font-size: 36px; line-height: 1.5; font-weight: 500; color: #fff; background: rgba(22,30,24,.86); padding: 8px 22px; border-radius: 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .progress { position: absolute; left: 0; bottom: 0; height: 10px; background: var(--accent); z-index: 3; }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="brand" id="brand"><img src="../../../public/brand-mark.png" alt=""><span>Amore Cost</span></div>
<div class="stage" id="stage"></div>
<div class="caption" id="caption"></div>
<div class="progress" id="progress"></div>
<script>
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const facts = (list, reveal) =>
  `<div class="facts">${list.map((f, i) => `<div class="fact ${reveal != null && i >= reveal ? "dim" : ""}"><span class="dot">${i + 1}</span><span>${esc(f)}</span></div>`).join("")}</div>`;

window.renderSlide = ({ scene, line, progress }) => {
  const stage = document.getElementById("stage");
  const reveal = line.reveal;
  document.getElementById("brand").style.visibility = scene.layout === "title" ? "hidden" : "visible";
  const head = `<span class="kicker">${esc(scene.kicker)}</span><h1>${esc(scene.headline)}</h1>`;
  stage.className = "stage";
  if (scene.layout === "title") {
    stage.classList.add("title");
    stage.innerHTML = `<img class="mark" src="../../../public/brand-mark.png" alt=""><span class="kicker">${esc(scene.kicker)}</span><h1>${esc(scene.headline)}</h1><p class="sub">${esc(scene.sub)}</p>`;
  } else if (scene.layout === "cards") {
    stage.classList.add("cardsl");
    stage.innerHTML = `<div>${head}</div><div class="cards">${scene.cards.map((c, i) => `<div class="card ${reveal != null && i >= reveal ? "dim" : ""}"><div class="ic">${c.icon}</div><h3>${esc(c.title)}</h3><p>${esc(c.body)}</p></div>`).join("")}</div>`;
  } else {
    const shot = `shots/${scene.shot}`;
    const media =
      scene.layout === "phone" ? `<div class="phone"><img src="${shot}" alt=""></div>` :
      scene.layout === "receipt" ? `<div class="receipt"><img src="${shot}" alt=""></div>` :
      `<div class="frame"><div class="bar"><i></i><i></i><i></i></div><img src="${shot}" alt=""></div>`;
    if (scene.layout === "receipt") stage.classList.add("receiptl");
    stage.innerHTML = `<div class="text">${head}${facts(scene.facts, reveal)}</div><div class="shotwrap">${media}</div>`;
  }
  document.getElementById("caption").innerHTML = `<span>${esc(line.caption)}</span>`;
  document.getElementById("progress").style.width = `${progress * 100}%`;
  return Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })))).then(() => document.fonts.ready);
};
</script>
</body>
</html>
